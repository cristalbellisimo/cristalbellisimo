    video{display:block;max-width:100%}
    
    .container{max-width:760px;padding:0 32px}  /* coluna de leitura, mais estreita */

    .hdr-in{max-width:1120px;margin:0 auto;padding:0 56px;display:flex;align-items:center;justify-content:space-between;height:62px}
    @media(max-width:768px){.hdr-in{padding:0 20px}}
    
    .back{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--il)}
    .hdr-r{display:flex;align-items:center;gap:22px}

    .capa{max-width:1120px;margin:0 auto;padding:0 56px}
    @media(max-width:768px){.capa{padding:0 20px}}
    .capa img,.capa video{width:100%;height:440px;object-fit:cover;margin-top:32px}
    @media(max-width:700px){.capa img,.capa video{height:280px}}

    article{padding:40px 0 100px}
    .post-data{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--il);margin-bottom:14px}
    h1{font-family:'Libre Caslon Text',serif;font-size:clamp(28px,5vw,44px);font-weight:400;line-height:1.15;margin-bottom:28px}
    .corpo p{font-size:16px;line-height:1.9;color:rgba(2,34,124,.82);margin-bottom:20px}
    .corpo-h{font-family:'Libre Caslon Text',serif;font-size:22px;font-weight:400;color:var(--p);margin:36px 0 14px}
    .corpo-q{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:20px;color:var(--gd);
      border-left:2px solid var(--gd);padding-left:20px;margin:28px 0}
    .galeria{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:36px}
    .galeria img,.galeria video{width:100%;height:220px;object-fit:cover}
    @media(max-width:600px){.galeria{grid-template-columns:1fr}}
    .cta-fim{border-top:1px solid var(--b);margin-top:48px;padding-top:32px;text-align:center}
    .btn{padding:12px 26px}  /* botões do artigo, um pouco maiores que o padrão */
    .naoEncontrado{padding:120px 0;text-align:center}

    .ftr{background:var(--p);color:var(--s);padding:48px 0;text-align:center;margin-top:40px}
    .ftr a{font-size:12px;color:rgba(254,249,240,.5);margin:0 10px}
    .ftr a:hover{color:var(--s)}

  </style>
</head>
<body>

<header class="hdr"><div class="hdr-in">
  <a href="index.html" class="logo">Cristal Bellísimo</a>

    <a href="blog.html" class="back" id="lnkVoltar">← Blog</a>

      <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu" aria-label="Idioma / Language">

      </button>
      <ul class="lang-menu" id="langMenu" role="listbox" aria-label="Idioma / Language"></ul>
    </div>
  </div>
</div></header>

<div class="capa" id="capaWrap"></div>

<div class="container">

      <a href="blog.html" class="btn btn-n" id="btnVoltarBlog">Voltar ao Blog</a>
    </div>
    <div id="conteudo"></div>
  </article>
</div>

<script src="content/blog.js"></script>
<script>
const TP = {
  pt: { back:'← Blog', naoEnc:'Artigo não encontrado.', voltar:'Voltar ao Blog', outrasHistorias:'Outras Histórias do Ateliê' },
  es: { back:'← Blog', naoEnc:'Artículo no encontrado.', voltar:'Volver al Blog', outrasHistorias:'Otras Historias del Atelier' },
  en: { back:'← Blog', naoEnc:'Article not found.', voltar:'Back to Blog', outrasHistorias:'More Stories from the Atelier' }
};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isVideo(src){return /\.(mp4|webm|mov|m4v|ogg)$/i.test(src||'');}
function fmtData(iso,lang){
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d))return iso||'';
  const locales={pt:'pt-BR',es:'es-ES',en:'en-US'};
  return d.toLocaleDateString(locales[lang]||'pt-BR',{day:'2-digit',month:'long',year:'numeric'});
}
function corpoHTML(paragrafos){
  /* convenção simples: "## texto" vira subtítulo, "> texto" vira citação em destaque */
  return (paragrafos||[]).map(p=>{
    if(typeof p!=='string') return '';
    if(p.startsWith('## ')) return `<h3 class="corpo-h">${esc(p.slice(3))}</h3>`;
    if(p.startsWith('> ')) return `<blockquote class="corpo-q">${esc(p.slice(2))}</blockquote>`;
    return `<p>${esc(p)}</p>`;
  }).join('');
}
function galeriaHTML(itens){
  if(!itens||!itens.length) return '';
  return `<div class="galeria">${itens.map(it=>{
    const src=typeof it==='string'?it:(it&&it.src)||'';
    return isVideo(src) ? `<video src="${esc(src)}" controls playsinline preload="metadata"></video>` : `<img src="${esc(src)}" alt="" loading="lazy">`;
  }).join('')}</div>`;
}
/* IDIOMAS — acrescentar o francês aqui e em TP/blog.js quando as traduções existirem */
const IDIOMAS=[
  {c:'pt',curto:'PT',nome:'Português',html:'pt-BR'},
  {c:'es',curto:'ES',nome:'Español', html:'es'},
  {c:'en',curto:'EN',nome:'English',  html:'en'}
];
const DISP=IDIOMAS.filter(i=>TP[i.c]);
function getLang(){
  const s=localStorage.getItem('cb_l'),br=navigator.language.slice(0,2);
  const ok=c=>DISP.some(i=>i.c===c);
  return ok(s)?s:(ok(br)?br:'pt');
}
function setLang(l){localStorage.setItem('cb_l',l);render();}
function render(){
  const lang=getLang();
  const tp=TP[lang]||TP.pt;
  const inf=DISP.find(i=>i.c===lang)||DISP[0];
  document.documentElement.setAttribute('data-lang',lang);
  document.documentElement.lang=inf.html;
  document.getElementById('langCur').textContent=inf.curto;
  document.querySelectorAll('#langMenu li').forEach(li=>li.setAttribute('aria-selected',li.dataset.l===lang?'true':'false'));
  document.getElementById('lnkVoltar').textContent=tp.back;
  document.getElementById('txtNaoEncontrado').textContent=tp.naoEnc;
  document.getElementById('btnVoltarBlog').textContent=tp.voltar;

  const slug=new URLSearchParams(location.search).get('slug');
  const posts=(window.BLOG&&Array.isArray(BLOG.posts))?BLOG.posts:[];
  const post=posts.find(p=>p.slug===slug);

  if(!post){
    document.getElementById('naoEncontrado').style.display='';
    document.getElementById('conteudo').innerHTML='';
    document.getElementById('capaWrap').innerHTML='';
    document.title=tp.naoEnc+' — Cristal Bellísimo';
    document.getElementById('pageTitle').textContent=document.title;
    return;
  }
  document.getElementById('naoEncontrado').style.display='none';
  const tx=post[lang]||post.pt||{};
  document.title=tx.titulo+' — Cristal Bellísimo';
  document.getElementById('pageTitle').textContent=tx.titulo+' — Cristal Bellísimo';
  document.getElementById('ogTitle').setAttribute('content',tx.titulo+' — Cristal Bellísimo');
  document.getElementById('ogDesc').setAttribute('content',tx.resumo||'');

  const capaWrap=document.getElementById('capaWrap');
  capaWrap.innerHTML = post.capaVideo
    ? `<video src="${esc(post.capaVideo)}" controls playsinline></video>`
    : (post.capa ? `<img src="${esc(post.capa)}" alt="${esc(tx.titulo)}">` : '');

  document.getElementById('conteudo').innerHTML = `
    <p class="post-data">${fmtData(post.data,lang)}</p>
    <h1 class="serif">${esc(tx.titulo)}</h1>
    <div class="corpo">${corpoHTML(tx.corpo)}</div>
    ${galeriaHTML(post.galeria)}
    <div class="cta-fim"><a href="blog.html" class="btn btn-n">${tp.outrasHistorias}</a></div>
  `;
}
/* ── seletor de idioma ── */
const lang=document.getElementById('lang'),langBtn=document.getElementById('langBtn'),langMenu=document.getElementById('langMenu');
langMenu.innerHTML=DISP.map(i=>`<li role="option" data-l="${i.c}" tabindex="-1" aria-selected="false">${i.nome}</li>`).join('');
function langAbrir(v){lang.classList.toggle('on',v);langBtn.setAttribute('aria-expanded',v?'true':'false');
  /* no desktop o ponteiro continua sobre o menu depois de escolher; 'travado' impede que o
     :hover reabra sozinho — destrava assim que o ponteiro sai do seletor */
  if(!v)lang.classList.add('travado');}
lang.addEventListener('mouseleave',()=>lang.classList.remove('travado'));
langBtn.addEventListener('click',e=>{e.stopPropagation();langAbrir(!lang.classList.contains('on'));});
langMenu.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;setLang(li.dataset.l);langAbrir(false);langBtn.focus();});
langMenu.addEventListener('keydown',e=>{
  const itens=[...langMenu.querySelectorAll('li')],i=itens.indexOf(document.activeElement);
  if(e.key==='Enter'||e.key===' '){e.preventDefault();if(i>=0){setLang(itens[i].dataset.l);langAbrir(false);langBtn.focus();}}
  if(e.key==='ArrowDown'){e.preventDefault();(itens[i+1]||itens[0]).focus();}
  if(e.key==='ArrowUp'){e.preventDefault();(itens[i-1]||itens[itens.length-1]).focus();}
});
langBtn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();langAbrir(true);
  /* espera o menu ficar realmente visível — um elemento com visibility:hidden não aceita foco */
  requestAnimationFrame(()=>{const p=langMenu.querySelector('li');if(p)p.focus();});}});
document.addEventListener('click',()=>langAbrir(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){langAbrir(false);langBtn.focus();}});

render();
</script>
</body>
