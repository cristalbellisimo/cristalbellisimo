  <style>

    video{display:block;max-width:100%}
    
    .container{max-width:1120px}  /* mais estreito que o padrão do base.css */

    /* nesta página o cabeçalho não usa .hdr-r com gap, então os espaçamentos são explícitos */
    nav a{margin-left:26px}
    .lang{margin-left:26px}
    .burger{margin-left:14px}
    .hero{padding:64px 0 40px;text-align:center;border-bottom:1px solid var(--b)}
    .sl{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--il);display:block;margin-bottom:12px}
    .hero h1{font-size:clamp(30px,4.5vw,52px);font-weight:400}
    .hero p{font-size:15px;font-style:italic;color:var(--il);max-width:520px;margin:14px auto 0;line-height:1.7}

    .lista{padding:64px 0 96px;display:grid;grid-template-columns:repeat(2,1fr);gap:48px 40px}
    @media(max-width:760px){.lista{grid-template-columns:1fr}}
    .post-card{cursor:pointer}
    .post-cap{overflow:hidden;margin-bottom:18px}
    .post-cap img,.post-cap video{width:100%;height:280px;object-fit:cover;transition:transform 1s cubic-bezier(.16,1,.3,1)}
    .post-capa-vazia{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      width:100%;height:280px;padding:24px;background:var(--p);color:var(--s);text-align:center}
    .post-capa-vazia::before{content:'';position:absolute;inset:16px;border:1px solid rgba(var(--gold-rgb),.55)}
    .post-capa-vazia .label{color:var(--gd)}
    .post-capa-vazia .serif{font-size:clamp(24px,4vw,36px);color:var(--s)}
    .post-card:hover .post-cap img{transform:scale(1.04)}
    .post-data{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--il);margin-bottom:8px}
    .post-title{font-family:'Libre Caslon Text',serif;font-size:24px;font-weight:400;margin-bottom:10px;color:var(--ink)}
    .post-resumo{font-size:14px;line-height:1.75;color:var(--il);margin-bottom:12px}
    .post-ler{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gd);border-bottom:1px solid var(--il);padding-bottom:2px}
    .vazio{padding:80px 0;text-align:center;color:var(--il);font-style:italic}

    .ftr{background:var(--p);color:var(--s);padding:48px 0;text-align:center;margin-top:40px}
    .ftr a{font-size:12px;color:rgba(var(--light-rgb),.7);margin:0 10px}
    .ftr a:hover{color:var(--s)}

  </style>
</head>
<body>

        <span id="langCur">PT</span><span class="lang-car" aria-hidden="true">▾</span>

    <button class="burger" id="burger" aria-expanded="false" aria-controls="mnav" aria-label="Menu">

<script src="content/blog.js"></script>
<script>
const TB = {
  pt: { nColecoes:'Coleções', nAtelie:'Ateliê', nBlog:'Blog', nContato:'Contato', lblBlog:'O Blog', tituloBlog:'Bastidores do Ateliê',
    introBlog:'Histórias, técnicas e criações do ateliê.', capaVazia:'Diário do Ateliê',
        ler:'Ler artigo completo', vazio:'Em breve, novas histórias.' },
  es: { nColecoes:'Colecciones', nAtelie:'Atelier', nBlog:'Blog', nContato:'Contacto', lblBlog:'El Blog', tituloBlog:'Detrás de Escena del Atelier',
    introBlog:'Historias, técnicas y creaciones del atelier.', capaVazia:'Crónica del Atelier',
        ler:'Leer artículo completo', vazio:'Pronto, nuevas historias.' },
  en: { nColecoes:'Collections', nAtelie:'Atelier', nBlog:'Blog', nContato:'Contact', lblBlog:'The Blog', tituloBlog:'Behind the Scenes at the Atelier',
    introBlog:'Stories, techniques and creations from the atelier.', capaVazia:'Atelier Journal',
        ler:'Read full article', vazio:'New stories coming soon.' }
};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtData(iso,lang){
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d))return iso;
  const locales={pt:'pt-BR',es:'es-ES',en:'en-US'};
  return d.toLocaleDateString(locales[lang]||'pt-BR',{day:'2-digit',month:'long',year:'numeric'});
}
function postCardHTML(p,lang){
  const tx=p[lang]||p.pt||{};
  const media=p.capaVideo
    ? `<video src="${esc(p.capaVideo)}" muted loop autoplay playsinline></video>`
    : (p.capa ? `<img src="${esc(p.capa)}" alt="${esc(tx.titulo)}" loading="lazy">` : `<div class="post-capa-vazia" aria-label="${esc(tx.titulo)} — ${(TB[lang]||TB.pt).capaVazia}" role="img"><span class="label">Cristal Bellísimo · Blog</span><span class="serif">${esc(tx.titulo)}</span></div>`);
  return `<a class="post-card" href="blog-post.html?slug=${encodeURIComponent(p.slug)}">
    <div class="post-cap">${media}</div>
    <p class="post-data">${fmtData(p.data,lang)}</p>
    <h2 class="post-title serif">${esc(tx.titulo)}</h2>
    <p class="post-resumo">${esc(tx.resumo)}</p>
    <span class="post-ler">${esc(TB[lang]?TB[lang].ler:TB.pt.ler)}</span>
  </a>`;
}
function renderLista(lang){
  const el=document.getElementById('listaPosts');
  const posts=(window.BLOG&&Array.isArray(BLOG.posts))?BLOG.posts.slice():[];
  posts.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(!posts.length){el.innerHTML=`<div class="vazio">${(TB[lang]||TB.pt).vazio}</div>`;return;}
  el.innerHTML=posts.map(p=>postCardHTML(p,lang)).join('');
}
/* IDIOMAS — acrescentar o francês aqui e em TB quando as traduções existirem */
const IDIOMAS=[
  {c:'pt',curto:'PT',nome:'Português',html:'pt-BR'},
  {c:'es',curto:'ES',nome:'Español', html:'es'},
  {c:'en',curto:'EN',nome:'English',  html:'en'}
];
const DISP=IDIOMAS.filter(i=>TB[i.c]);

function Lb(l){
  const d=TB[l];if(!d)return;
  const inf=DISP.find(i=>i.c===l)||DISP[0];
  document.documentElement.setAttribute('data-lang',l);
  document.documentElement.lang=inf.html;
  document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(d[k]!==undefined)e.textContent=d[k];});
  const cur=document.getElementById('langCur');if(cur)cur.textContent=inf.curto;
  document.querySelectorAll('#langMenu li').forEach(li=>li.setAttribute('aria-selected',li.dataset.l===l?'true':'false'));
  renderLista(l);
  localStorage.setItem('cb_l',l);
}

const lang=document.getElementById('lang'),langBtn=document.getElementById('langBtn'),langMenu=document.getElementById('langMenu');
langMenu.innerHTML=DISP.map(i=>`<li role="option" data-l="${i.c}" tabindex="-1" aria-selected="false">${i.nome}</li>`).join('');
function langAbrir(v){lang.classList.toggle('on',v);langBtn.setAttribute('aria-expanded',v?'true':'false');
  /* no desktop o ponteiro continua sobre o menu depois de escolher; 'travado' impede que o
     :hover reabra sozinho — destrava assim que o ponteiro sai do seletor */
  if(!v)lang.classList.add('travado');}
lang.addEventListener('mouseleave',()=>lang.classList.remove('travado'));
langBtn.addEventListener('click',e=>{e.stopPropagation();langAbrir(!lang.classList.contains('on'));});
langMenu.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;Lb(li.dataset.l);langAbrir(false);langBtn.focus();});
langMenu.addEventListener('keydown',e=>{
  const itens=[...langMenu.querySelectorAll('li')],i=itens.indexOf(document.activeElement);
  if(e.key==='Enter'||e.key===' '){e.preventDefault();if(i>=0){Lb(itens[i].dataset.l);langAbrir(false);langBtn.focus();}}
  if(e.key==='ArrowDown'){e.preventDefault();(itens[i+1]||itens[0]).focus();}
  if(e.key==='ArrowUp'){e.preventDefault();(itens[i-1]||itens[itens.length-1]).focus();}
});
langBtn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();langAbrir(true);
  /* espera o menu ficar realmente visível — um elemento com visibility:hidden não aceita foco */
  requestAnimationFrame(()=>{const p=langMenu.querySelector('li');if(p)p.focus();});}});
document.addEventListener('click',()=>langAbrir(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){langAbrir(false);mnavAbrir(false);}});

const burger=document.getElementById('burger'),mnav=document.getElementById('mnav');
function mnavAbrir(v){mnav.classList.toggle('on',v);burger.setAttribute('aria-expanded',v?'true':'false');}
burger.addEventListener('click',e=>{e.stopPropagation();mnavAbrir(!mnav.classList.contains('on'));});
mnav.addEventListener('click',e=>{if(e.target.tagName==='A')mnavAbrir(false);});

(function(){const s=localStorage.getItem('cb_l'),br=navigator.language.slice(0,2);
 const ok=c=>DISP.some(i=>i.c===c);
 Lb(ok(s)?s:(ok(br)?br:'pt'));})();
</script>
